version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: Trinity-brain-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - Trinity-brain

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: Trinity-brain-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - Trinity-brain

  milvus-standalone:
    image: milvusdb/milvus:v2.3.3
    container_name: Trinity-brain-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - Trinity-brain

  ollama:
    image: ollama/ollama:latest
    container_name: Trinity-brain-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - Trinity-brain
    deploy:
      resources:
        limits:
          memory: 6G

  ollama-init:
    image: ollama/ollama:latest
    container_name: Trinity-brain-ollama-init
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10
        ollama pull nomic-embed-text
        ollama pull qwen2.5:7b
        echo "Models pulled successfully"
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - Trinity-brain

  neo4j:
    image: neo4j:5-community
    container_name: Trinity-brain-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/Trinity2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 128M
      NEO4J_server_memory_heap_max__size: 256M
      NEO4J_server_memory_pagecache_size: 128M
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "Trinity2026", "RETURN 1"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - Trinity-brain

  brain-api:
    build:
      context: ../brain-api
      dockerfile: Dockerfile
    container_name: Trinity-brain-api
    ports:
      - "8100:8100"
    volumes:
      - ./brain-config.json:/app/config.json:ro
      - brain_data:/app/data
    environment:
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: "19530"
      OLLAMA_URL: http://ollama:11434
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: Trinity2026
      CONFIG_PATH: /app/config.json
      DATA_DIR: /app/data
    depends_on:
      milvus-standalone:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - Trinity-brain

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  ollama_data:
  neo4j_data:
  brain_data:

networks:
  Trinity-brain:
    driver: bridge
