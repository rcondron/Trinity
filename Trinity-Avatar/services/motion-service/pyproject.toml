[project]
name = "trinity-motion-service"
version = "0.1.0"
description = "Body motion service for Trinity Avatar — NVIDIA ARDY with a procedural clip fallback"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
