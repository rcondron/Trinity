version: '3.8'

name: trinity

services:
  trinity:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trinity-gateway
    ports:
      - "18789:18789"
      - "8100:8100"  # expose brain api too if needed
    volumes:
      - trinity_data:/root/.Trinity
      - ./workspace:/app/workspace
    environment:
      - TRINITY_BRAIN_API=http://brain-api:8100
      - TRINITY_BRAIN_ENABLED=true
      - NODE_ENV=production
    depends_on:
      brain-api:
        condition: service_healthy
    networks:
      - trinity
    command: ["node", "Trinity.mjs", "gateway", "--allow-unconfigured"]

  # Memory Stack (Trinity Brain - native)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: trinity-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - trinity

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: trinity-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - trinity

  milvus-standalone:
    image: milvusdb/milvus:v2.3.3
    container_name: trinity-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - trinity

  ollama:
    image: ollama/ollama:latest
    container_name: trinity-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - trinity
    deploy:
      resources:
        limits:
          memory: 6G

  ollama-init:
    image: ollama/ollama:latest
    container_name: trinity-ollama-init
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 15
        ollama pull nomic-embed-text
        ollama pull qwen2.5:7b
        echo "Ollama models pulled successfully for Trinity Brain"
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - trinity

  neo4j:
    image: neo4j:5-community
    container_name: trinity-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/Trinity2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "Trinity2026", "RETURN 1"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - trinity

  brain-api:
    build:
      context: ../Trinity-Brain
      dockerfile: Dockerfile
    container_name: trinity-brain-api
    ports:
      - "8101:8100"  # avoid conflict with gateway if any
    volumes:
      - ./docker/brain-config.json:/app/config.json:ro
      - brain_data:/app/data
    environment:
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - OLLAMA_URL=http://ollama:11434
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=Trinity2026
      - CONFIG_PATH=/app/config.json
      - DATA_DIR=/app/data
      - PORT=8100
    depends_on:
      milvus-standalone:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - trinity

volumes:
  trinity_data:
  etcd_data:
  minio_data:
  milvus_data:
  ollama_data:
  neo4j_data:
  brain_data:

networks:
  trinity:
    driver: bridge
